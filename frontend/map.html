<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SafeCity AI - Safety Map</title>

  <link rel="stylesheet" href="style.css">

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

  <style>
    #map{
      width:100%;
      height:500px;
      border-radius:18px;
      margin-top:20px;
    }
  </style>
</head>

<body>

<nav class="navbar">
  <div class="logo">SafeCity AI</div>

  <div class="nav-links">
    <a href="index.html">Home</a>
    <a href="map.html">Safety Map</a>
    <a href="safety.html">AI Analysis</a>
  </div>
</nav>

<div class="container">

  <header class="map-header">
    <h1>Safety Map</h1>
    <a href="index.html" class="back-btn">Back</a>
  </header>

  <div id="map"></div>

</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
  
    
const map=L.map("map").setView([17.385,78.486],13);

L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{
attribution:"© OpenStreetMap contributors"
}).addTo(map);

const places=[
{lat:17.390,lng:78.485,color:"#dc2626",text:"High Risk",score:54},
{lat:17.382,lng:78.490,color:"#f59e0b",text:"Moderate Risk",score:76},
{lat:17.376,lng:78.478,color:"#16a34a",text:"Safe Area",score:94}
];

places.forEach(p=>{

L.circle([p.lat,p.lng],{
color:p.color,
fillColor:p.color,
fillOpacity:.35,
radius:350
})
.addTo(map)
.bindPopup(`
<div style="min-width:180px">
<h3>${p.text}</h3>
<p><strong>Safety Score:</strong> ${p.score}/100</p>
<p>AI Recommendation available.</p>
</div>
`);

});

if(navigator.geolocation){

navigator.geolocation.getCurrentPosition(pos=>{

L.marker([pos.coords.latitude,pos.coords.longitude])
.addTo(map)
.bindPopup("Your Current Location");

});

}
</script>


</body>
</html>
